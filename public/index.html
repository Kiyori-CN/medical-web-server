<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="本地医学题库搜题与刷题">
  <title>医学题库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b4639'/%3E%3Cpath d='M28 14h8v14h14v8H36v14h-8V36H14v-8h14z' fill='%23fffdf6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="page-shell">
    <header class="topbar">
      <a class="brand" href="/" aria-label="医学题库首页">
        <span class="brand-mark" aria-hidden="true">M</span>
        <span>
          <strong>医学题库</strong>
          <small>本地搜题与刷题</small>
        </span>
      </a>
      <div class="status-pill" id="catalogStatus" aria-live="polite">
        <span class="status-dot"></span>
        <span>连接题库中</span>
      </div>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">STRUCTURED MEDICAL BANK</p>
        <h1>找到原题，也真正练会它。</h1>
        <p class="hero-copy">结构化题库、毫秒级全文检索与本地练习进度，数据不离开服务器。</p>
        <div class="metric-row" id="metricRow" aria-label="题库统计">
          <div><strong>—</strong><span>规范题目</span></div>
          <div><strong>—</strong><span>题集</span></div>
          <div><strong>—</strong><span>来源记录</span></div>
        </div>
      </section>

      <nav class="mode-tabs" aria-label="功能切换">
        <button class="mode-tab active" type="button" data-view="search">搜题</button>
        <button class="mode-tab" type="button" data-view="practice">刷题</button>
        <button class="mode-tab" type="button" data-view="wrong">错题</button>
      </nav>

      <section class="view active" id="searchView" data-view-panel="search">
        <div class="panel search-panel">
          <form id="searchForm" class="search-form">
            <label class="search-field">
              <span class="sr-only">题目关键词</span>
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-4-4"></path></svg>
              <input id="searchInput" name="query" maxlength="500" autocomplete="off" placeholder="粘贴题干，或输入疾病、症状、考点……">
            </label>
            <button class="primary-button" type="submit">搜索</button>
          </form>
          <div class="filter-row">
            <label>考试
              <select id="searchExam">
                <option value="">全部考试</option>
                <option value="三基考试">三基考试</option>
                <option value="专硕考研(306临床医学综合能力)">专硕 306</option>
                <option value="学硕考研(699联考西医综合)">学硕 699</option>
                <option value="执业医师">执业医师</option>
              </select>
            </label>
            <label>题型
              <select id="searchType">
                <option value="">全部题型</option>
                <option>单选题</option><option>多选题</option><option>判断题</option>
                <option>填空题</option><option>名词解释</option><option>简答题</option><option>论述题</option>
              </select>
            </label>
            <label class="check-label"><input id="includeSolution" type="checkbox" checked> 显示答案与解析</label>
          </div>
        </div>
        <div class="section-heading">
          <div><p class="eyebrow">SEARCH RESULTS</p><h2 id="searchHeading">输入题干开始搜索</h2></div>
          <span id="searchMeta"></span>
        </div>
        <div id="searchResults" class="card-list empty-state">
          <div class="empty-icon" aria-hidden="true">⌕</div>
          <p>支持完整题干、关键词和短查询。</p>
        </div>
      </section>

      <section class="view" id="practiceView" data-view-panel="practice" hidden>
        <div class="panel practice-setup" id="practiceSetup">
          <div>
            <p class="eyebrow">NEW SESSION</p>
            <h2>开始一组本地练习</h2>
            <p>题目下发时隐藏答案，提交后再显示判定与解析。</p>
          </div>
          <div class="setup-grid">
            <label>考试
              <select id="practiceExam">
                <option value="">全部考试</option>
                <option value="三基考试">三基考试</option>
                <option value="专硕考研(306临床医学综合能力)">专硕 306</option>
                <option value="学硕考研(699联考西医综合)">学硕 699</option>
                <option value="执业医师">执业医师</option>
              </select>
            </label>
            <label>题型
              <select id="practiceType">
                <option value="单选题">单选题</option>
                <option value="多选题">多选题</option>
                <option value="判断题">判断题</option>
                <option value="填空题">填空题</option>
              </select>
            </label>
            <label>年份
              <input id="practiceYear" type="number" min="1980" max="2100" placeholder="可选，如 2026">
            </label>
            <label>题量
              <select id="practiceCount"><option>5</option><option selected>10</option><option>20</option><option>50</option></select>
            </label>
          </div>
          <button class="primary-button" id="startPractice" type="button">开始刷题</button>
        </div>

        <div id="practiceWorkspace" hidden>
          <div class="practice-toolbar">
            <div>
              <span id="practiceProgress">第 1 / 10 题</span>
              <div class="progress-track"><span id="practiceProgressBar"></span></div>
            </div>
            <button class="text-button" id="newPractice" type="button">结束并新建</button>
          </div>
          <article class="question-card practice-card" id="practiceCard"></article>
        </div>
      </section>

      <section class="view" id="wrongView" data-view-panel="wrong" hidden>
        <div class="section-heading">
          <div><p class="eyebrow">WRONG ANSWERS</p><h2>本地错题记录</h2></div>
          <button class="secondary-button" id="refreshWrong" type="button">刷新</button>
        </div>
        <div id="wrongResults" class="card-list empty-state"><p>进入此页后加载错题。</p></div>
      </section>
    </main>

    <footer>
      <span>medical-web-server v2</span>
      <span>SQLite · FTS5 · Local-first</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="/app.js" defer></script>
</body>
</html>
