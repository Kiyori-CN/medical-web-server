<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f6fa">
  <meta name="description" content="医考知库：按原始题库目录精确检索、刷题与复习。">
  <title>医考知库</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%235a5bd7'/%3E%3Cpath d='M18 19h20c5 0 8 3 8 8v19H26c-5 0-8-3-8-8V19zm8 8v5h12v-5H26zm0 10v4h8v-4h-8z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?rev=abd6143">
</head>
<body>
  <div id="toast-region" class="toast-region" aria-live="polite"></div>

  <main id="auth-page" class="auth-page" hidden>
    <section class="auth-intro" aria-labelledby="auth-brand-title">
      <a class="brand brand-large" href="#library" aria-label="医考知库首页">
        <span class="brand-mark" aria-hidden="true">知</span>
        <span><strong id="auth-brand-title">医考知库</strong><small>Medical Exam Workspace</small></span>
      </a>
      <div class="auth-copy">
        <p class="eyebrow">本地医学题库工作台</p>
        <h1>把检索、练习与复习，放回同一条学习路径。</h1>
        <p>保留原题库目录、原文件和原题号，支持精确搜题、语义检索与跨设备练习。</p>
      </div>
      <ul class="auth-points" aria-label="产品能力">
        <li><span>01</span>按原文件精确刷题</li>
        <li><span>02</span>收藏与错题自动归档</li>
        <li><span>03</span>账号数据完全本地保存</li>
      </ul>
    </section>
    <section class="auth-panel">
      <div class="auth-card">
        <div id="auth-heading"></div>
        <div id="auth-tabs" class="auth-tabs" role="tablist"></div>
        <form id="auth-form" class="stack-form" autocomplete="on">
          <label>
            <span>用户名</span>
            <input id="auth-username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="32" placeholder="请输入用户名">
          </label>
          <label>
            <span>密码</span>
            <span class="password-field">
              <input id="auth-password" name="password" type="password" autocomplete="current-password" required minlength="10" maxlength="128" placeholder="请输入密码">
              <button class="text-button" type="button" data-action="toggle-password" aria-label="显示或隐藏密码">显示</button>
            </span>
          </label>
          <p id="auth-password-tip" class="form-tip"></p>
          <button id="auth-submit" class="button button-primary button-wide" type="submit">登录</button>
          <p id="auth-error" class="form-error" role="alert"></p>
        </form>
        <p class="auth-security">会话采用 HttpOnly Cookie 与 CSRF 校验，密码仅保存安全哈希。</p>
      </div>
    </section>
  </main>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#library" data-nav="library" data-action="library-home">
          <span class="brand-mark" aria-hidden="true">知</span>
          <span><strong id="site-brand-name">医考知库</strong><small>医学题库工作台</small></span>
        </a>
        <nav class="desktop-nav" aria-label="主导航">
          <a href="#library" data-nav="library">题库</a>
          <a href="#search" data-nav="search">搜题</a>
          <a href="#ai" data-nav="ai">AI</a>
          <a href="#forum" data-nav="forum">论坛</a>
          <a href="#profile" data-nav="profile">我的</a>
        </nav>
        <div class="topbar-actions">
          <button id="admin-entry" class="button button-quiet admin-only" type="button" data-action="open-admin" hidden>系统管理</button>
          <button class="profile-button" type="button" data-action="open-messages" aria-label="打开消息">
            <span id="profile-avatar" class="profile-avatar"><span id="profile-avatar-glyph">U</span></span>
            <span class="profile-copy"><strong id="profile-name">用户</strong><small id="profile-role">普通用户</small></span>
          </button>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace" tabindex="-1">
      <section id="page-library" class="page"></section>
      <section id="page-search" class="page" hidden></section>
      <section id="page-favorites" class="page" hidden></section>
      <section id="page-wrong" class="page" hidden></section>
      <section id="page-practice" class="page page-practice" hidden></section>
      <section id="page-profile" class="page" hidden></section>
      <section id="page-profile-detail" class="page" hidden></section>
      <section id="page-settings" class="page" hidden></section>
      <section id="page-messages" class="page" hidden></section>
      <section id="page-my-comments" class="page" hidden></section>
      <section id="page-notes" class="page" hidden></section>
      <section id="page-my-likes" class="page" hidden></section>
      <section id="page-ai" class="page" hidden></section>
      <section id="page-forum" class="page" hidden></section>
      <section id="page-admin" class="page" hidden></section>
    </main>

    <nav class="mobile-nav" aria-label="移动端主导航">
      <a href="#library" data-nav="library"><span aria-hidden="true">▦</span><small>题库</small></a>
      <a href="#search" data-nav="search"><span aria-hidden="true">⌕</span><small>搜题</small></a>
      <a href="#ai" data-nav="ai"><span aria-hidden="true">✦</span><small>AI</small></a>
      <a href="#forum" data-nav="forum"><span aria-hidden="true">◌</span><small>论坛</small></a>
      <a href="#profile" data-nav="profile"><span aria-hidden="true">◎</span><small>我的</small></a>
    </nav>
  </div>

  <div id="modal-root"></div>
  <script src="/app.js?rev=abd6143" defer></script>
</body>
</html>
